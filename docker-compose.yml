services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustrail
      POSTGRES_USER: trustrail
      POSTGRES_PASSWORD: trustrail_dev_only
    ports:
      - "5432:5432"
    volumes:
      - trustrail-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustrail -d trustrail"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      TRUSTRAIL_ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://trustrail:trustrail_dev_only@host.docker.internal:5432/trustrail
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  trustrail-postgres:
